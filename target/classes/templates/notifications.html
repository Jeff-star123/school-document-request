<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Saint Jude College Manila</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>
    <div class="page-geometric-bg">
        <div class="tile tile-1"></div>
        <div class="tile tile-3"></div>
        <div class="tile tile-4"></div>
    </div>

    <nav class="sjc-navbar">
        <a class="brand-wrapper" th:href="@{/student/dashboard}">
            <img th:src="@{/images/sjc-seal.png}" alt="SJC" onerror="this.onerror=null; this.style.display='none';">
            <div class="brand-text">
                <h1>Saint Jude College</h1>
                <span>Document Request System</span>
            </div>
        </a>
        <div class="nav-links-cluster">
            <a th:href="@{/student/dashboard}" class="nav-item">Dashboard</a>
            <a th:href="@{/student/notifications}" class="nav-item active">Notifications</a>
            <a th:href="@{/student/assistant}" class="nav-item">AI Assistant</a>
            <a th:href="@{/settings}" class="nav-item">Settings</a>
            <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme"></button>
            <a th:href="@{/logout}" class="btn-logout">Logout</a>
        </div>
    </nav>

    <div class="dashboard-container" style="max-width: 800px;">
        <div class="dashboard-banner">
            <div>
                <h2>Activity & <span>System Alerts</span></h2>
                <p>Track request updates, schedule changes, and security events.</p>
            </div>
        </div>

        <div class="content-card-sjc">
            <div class="content-card-header">
                <h3>All Notifications</h3>
            </div>
            <div style="padding: 1.5rem;">
                <div th:if="${#lists.isEmpty(notifications)}" style="text-align:center; padding: 2.5rem; color: var(--text-secondary);">
                    No notifications yet.
                </div>
                <div th:each="n : ${notifications}" style="padding: 1rem 0; border-bottom: 1px solid var(--surface-border);">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong style="color: var(--sjc-green);" th:text="${n.title}"></strong>
                        <small style="color: var(--text-muted);" th:text="${#temporals.format(n.createdAt, 'MMM dd, yyyy HH:mm')}"></small>
                    </div>
                    <p style="margin-top: 0.35rem; font-size: 0.9rem; color: var(--text-primary);" th:text="${n.message}"></p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
