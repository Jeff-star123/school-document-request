<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Saint Jude College Manila</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>
    <div class="portal-container">
        <div class="theme-toggle-fixed">
            <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme"></button>
        </div>

        <div class="portal-showcase">
            <div class="geometric-bg">
                <div class="tile tile-1"></div>
                <div class="tile tile-2"></div>
                <div class="tile tile-3"></div>
                <div class="tile tile-4"></div>
            </div>
            <div class="showcase-content">
                <img th:src="@{/images/sjc-seal.png}" alt="SJC" class="sjc-crest" onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/en/thumb/f/f7/Saint_Jude_College_Manila_Seal.png/250px-Saint_Jude_College_Manila_Seal.png';">
                <h1 class="showcase-title">Saint Jude College Manila</h1>
                <p class="showcase-sub">Self-Service Account Recovery Portal</p>
            </div>
        </div>

        <div class="portal-form-wrapper">
            <div class="auth-form-card">
                <div class="form-header-underline">
                    <h2>Reset Password</h2>
                </div>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="@{/forgot-password}" method="POST">
                    <div class="input-field-group">
                        <label><span class="req">*</span> Registered Institutional Email</label>
                        <div class="input-wrapper" style="display:flex; gap:0.5rem;">
                            <input type="email" id="resetEmail" name="email" placeholder="user@phinmaed.com" pattern=".+@phinmaed\.com" required />
                            <button type="button" class="btn-save-sjc" onclick="sendOtp()" style="white-space:nowrap;">Get OTP</button>
                        </div>
                        <small id="otpStatus" style="color: var(--sjc-green); font-weight:600; margin-top:4px; display:block;"></small>
                    </div>

                    <div class="input-field-group">
                        <label><span class="req">*</span> 6-Digit Email OTP</label>
                        <div class="input-wrapper">
                            <input type="text" name="otp" placeholder="Enter 6-digit OTP code" maxlength="6" required />
                        </div>
                    </div>

                    <!-- New Password with Eye Toggle -->
                    <div class="input-field-group">
                        <label><span class="req">*</span> New Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="resetNewPassword" name="newPassword" placeholder="Enter new password" required />
                            <button type="button" class="password-toggle-btn" onclick="togglePassword('resetNewPassword', this)" title="Show / Hide Password">
                                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Confirm Password with Eye Toggle -->
                    <div class="input-field-group">
                        <label><span class="req">*</span> Confirm New Password</label>
                        <div class="input-wrapper">
                            <input type="password" id="resetConfirmPassword" name="confirmPassword" placeholder="Re-type new password" required />
                            <button type="button" class="password-toggle-btn" onclick="togglePassword('resetConfirmPassword', this)" title="Show / Hide Password">
                                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit-portal">
                        Confirm Password Reset &nbsp;➔
                    </button>
                </form>

                <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem;">
                    Remember your password? <a th:href="@{/login}" style="color: var(--sjc-green); font-weight:700; text-decoration:none;">Back to Sign In</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function sendOtp() {
            const email = document.getElementById('resetEmail').value;
            const status = document.getElementById('otpStatus');
            if(!email || !email.endsWith('@phinmaed.com')) {
                alert('Please enter a valid @phinmaed.com email first.');
                return;
            }
            status.textContent = 'Sending OTP...';
            const formData = new FormData();
            formData.append('email', email);

            fetch('/api/send-reset-otp', { method: 'POST', body: formData })
                .then(res => res.text())
                .then(data => {
                    status.textContent = '✔ OTP sent! Check your inbox or terminal console.';
                }).catch(() => {
                    status.textContent = 'Failed to send OTP.';
                });
        }
    </script>
</body>
</html>
