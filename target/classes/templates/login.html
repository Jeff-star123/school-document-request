<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - School Document Request</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>
    <div style="position: absolute; top: 1.5rem; right: 2rem;">
        <button class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Theme"></button>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Document Request</h2>
                <p>Saint Jude College Manila Portal</p>
            </div>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${param.registered}" class="alert alert-success">Account registered! You can now log in.</div>

            <form th:action="@{/login}" method="POST">
                <div class="form-group">
                    <label>School Email (@phinmaed.com)</label>
                    <input type="email" name="email" class="form-control" placeholder="user@phinmaed.com" pattern=".+@phinmaed\.com" required />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required />
                </div>
                <button type="submit" class="btn btn-primary">Sign In</button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem; color: var(--text-secondary);">
                Don't have an account? <a th:href="@{/register}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Create Account</a>
            </div>
        </div>
    </div>
</body>
</html>
